<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Temporarily Unavailable</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 45%,
        #172b46 0%, #07111f 45%, #02050a 100%);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    position: relative;
}

body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(120deg,
        transparent 40%,
        rgba(255, 153, 0, 0.08) 50%,
        transparent 60%);
    animation: lightMove 7s linear infinite;
}

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    background: #ff9d00;
    filter: blur(150px);
    opacity: 0.15;
    border-radius: 50%;
    bottom: -100px;
    left: -80px;
}

.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 650px;
    padding: 30px 22px;
}

.icon {
    font-size: 65px;
    margin-bottom: 28px;
    color: #ffb000;
    text-shadow: 0 0 30px #ff9d0066;
    animation: pulse 2s infinite;
}

.line {
    width: 90px;
    height: 4px;
    background: #ffae00;
    margin: 0 auto 30px;
    border-radius: 10px;
    box-shadow: 0 0 18px #ffae0080;
}

h1 {
    font-size: clamp(34px, 8vw, 65px);
    font-weight: 900;
    line-height: 1.12;
    letter-spacing: -1px;
    text-transform: uppercase;
}

h1 span {
    display: block;
    color: #ffae00;
    text-shadow: 0 0 30px #ffae0030;
    margin: 10px 0;
}

p {
    margin-top: 28px;
    color: #aab7c8;
    font-size: 16px;
    line-height: 1.8;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin-top: 32px;
    padding: 12px 20px;
    border: 1px solid #ffae0045;
    background: #ffae000d;
    border-radius: 30px;
    color: #ffc34d;
    font-size: 12px;
    letter-spacing: 2px;
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ffae00;
    box-shadow: 0 0 12px #ffae00;
}

.footer {
    margin-top: 45px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #536174;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.08);
        opacity: 0.75;
    }
}

@keyframes lightMove {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
}
</style>
</head>

<body>

<div class="glow"></div>

<main class="container">

    <div class="icon">⚙</div>

    <div class="line"></div>

    <h1>
        Website
        <span>Temporary</span>
        Unavailable
    </h1>

    <p>
        We are currently unavailable.<br>
        Please try again later.
    </p>

    <div class="status">
        <span class="dot"></span>
        TEMPORARILY UNAVAILABLE
    </div>

    <div class="footer">
        THANK YOU FOR YOUR PATIENCE
    </div>

</main>

</body>
</html>
